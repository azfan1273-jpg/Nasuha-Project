name: nasuha_kasir_laundry
description: "Aplikasi Kasir Laundry - Nasuha Kasir Laundry"
publish_to: 'none' 
version: 1.0.0+4

environment:
  sdk: '>=3.12.2 <4.0.0' 

dependencies:
    flutter:
      sdk: flutter
    print_bluetooth_thermal: ^1.1.0
    flutter_blue_plus: ^1.35.5
    permission_handler: ^11.3.1
    cupertino_icons: ^1.0.8
    provider: ^6.1.5+1
    supabase_flutter: ^2.8.3
    shared_preferences: ^2.5.5
    remixicon: ^1.2.0
    calendar_date_picker2: ^3.0.0
    url_launcher: ^6.3.2
    fl_chart: ^0.68.0
    excel: ^4.0.0
    path_provider: ^2.1.2
    open_file: ^3.3.2
    sqflite: ^2.4.3
    flutter_dotenv: ^5.1.0
    flutter_local_notifications: ^22.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
      - assets/icon/app_icon.png
      - .env
  
flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
